app = "bentopdf-elan"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"
  [build.args]
    VITE_BRAND_NAME = "ELAN Languages"
    SIMPLE_MODE = "true"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
